name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Prepare Keystores
        run: |
          if [ -f "debug.keystore.base64" ]; then
            echo "Decoding debug.keystore from debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            echo "Generating new debug.keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f "my-upload-key.jks" ]; then
            echo "Generating dummy my-upload-key.jks for unsigned release..."
            keytool -genkey -v -keystore my-upload-key.jks -storepass android -alias upload -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Release,O=Android,C=US"
          fi

      - name: Prepare Release Keystore
        run: |
          rm -f app/release.keystore app/decoded.keystore

          # 1. Try decoding KEYSTORE_BASE64 secret if provided
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Attempting to decode KEYSTORE_BASE64 from GitHub Secrets..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/decoded.keystore 2>/dev/null || true
          fi

          # 2. Select valid non-empty keystore
          if [ -s "app/decoded.keystore" ]; then
            echo "Using decoded KEYSTORE_BASE64 secret."
            cp app/decoded.keystore app/release.keystore
          elif [ -s "app/my-release-key.jks" ]; then
            echo "Using app/my-release-key.jks from repository."
            cp app/my-release-key.jks app/release.keystore
          elif [ -s "my-release-key.jks" ]; then
            echo "Using my-release-key.jks from repository root."
            cp my-release-key.jks app/release.keystore
          else
            echo "No valid custom keystore file found or secret was empty/invalid."
            echo "Generating new release.keystore in GitHub Actions..."
            keytool -genkey -v -keystore app/release.keystore -storepass "${{ secrets.STORE_PASSWORD || 'Shivzo@#.2003' }}" -alias "${{ secrets.KEY_ALIAS || 'my-key-alias' }}" -keypass "${{ secrets.KEY_PASSWORD || 'Shivzo@#.2003' }}" -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Shivzo Release,O=Shivzo,C=US"
          fi

          # Sanity check: Ensure generated or copied keystore is not 0 bytes
          if [ ! -s "app/release.keystore" ]; then
            echo "Keystore is empty or corrupt. Generating fresh fallback..."
            rm -f app/release.keystore
            keytool -genkey -v -keystore app/release.keystore -storepass "Shivzo@#.2003" -alias "my-key-alias" -keypass "Shivzo@#.2003" -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Shivzo Release,O=Shivzo,C=US"
          fi

      - name: Build Release APK and AAB
        env:
          KEYSTORE_PATH: app/release.keystore
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'Shivzo@#.2003' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'my-key-alias' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'Shivzo@#.2003' }}
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew :app:assembleRelease :app:bundleRelease -x lint --stacktrace
          else
            gradle :app:assembleRelease :app:bundleRelease -x lint --stacktrace
          fi

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shivzo-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Upload Release AAB (Bundle) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shivzo-Release-AAB
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: warn

      - name: Upload Release Keystore Key (Backup)
        uses: actions/upload-artifact@v4
        with:
          name: Shivzo-Release-Keystore-Backup
          path: app/release.keystore
          if-no-files-found: warn
